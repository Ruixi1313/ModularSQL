########################################################################
# ModularSQL config for BIRD-Dev via OpenRouter + open-source MoE models
# Embeddings run LOCALLY via sentence-transformers (no API cost).
# All LLM stages share the same OpenRouter endpoint and Qwen3-Coder model.
#
# IMPORTANT: provide OPENROUTER_API_KEY via .env or your shell and use
# the env-substitution wrapper (see src/adapters/load_config.py).
########################################################################

[logger]
print_level = "INFO"

[dataset]
type = "bird"
split = "dev"
root_path = "data/bird"
save_path = "workspace_p2/dataset/bird/dev.snapshot"

# Sampling for ablation experiments:
#   max_samples_per_db = 9  -> 11 DBs x 9 = 99 samples covering all BIRD-Dev schemas
# Comment this out (and remove max_samples) for the full 1534-sample run.
max_samples_per_db = 9

########################################################################
# Vector database — LOCAL embeddings (free, runs on CPU)
########################################################################
[vector_database]
api_type = "local"
embedding_model_name_or_path = "sentence-transformers/all-MiniLM-L6-v2"
store_root_path = "workspace_p2/vector_database/bird/dev"
embedding_device = "auto"   # auto | cpu | cuda
max_value_length = 100
lower_meta_data = true
batch_size = 128
db_parallel = 2
column_parallel = 4
build_backend = "local_index"

########################################################################
# Stage 1: Value Retrieval
########################################################################
[value_retrieval]
n_results = 5
n_parallel = 4
query_parallel_per_sample = 8
backend = "local_index"
local_index_device = "auto"
save_path = "workspace_p2/value_retrieval/bird/dev.snapshot"

[value_retrieval.llm]
model = "qwen/qwen3-coder-30b-a3b-instruct"
base_url = "https://openrouter.ai/api/v1"
api_key = "${OPENROUTER_API_KEY}"
max_tokens = 4096
temperature = 0.7
api_type = "openai"
max_model_len = 128000

########################################################################
# Stage 2: Schema Linking (direct + reversed + value-based)
########################################################################
[schema_linking]
n_parallel = 4
n_internal_parallel = 3
save_path = "workspace_p2/schema_linking/bird/dev.snapshot"
direct_linking_sampling_budget = 4
reversed_linking_sampling_budget = 4
value_distance_threshold = 0.02

[schema_linking.llm]
model = "qwen/qwen3-coder-30b-a3b-instruct"
base_url = "https://openrouter.ai/api/v1"
api_key = "${OPENROUTER_API_KEY}"
max_tokens = 4096
temperature = 0.7
api_type = "openai"
max_model_len = 128000

########################################################################
# Stage 3: SQL Generation (N-version Programming: dc + skeleton + icl)
########################################################################
[sql_generation]
n_parallel = 4
n_internal_parallel = 3
save_path = "workspace_p2/sql_generation/bird/dev.snapshot"
dc_sampling_budget = 4
skeleton_sampling_budget = 4
icl_sampling_budget = 4
icl_few_shot_examples_path = "results/bird_dev_few_shots.json"

[sql_generation.llm]
model = "qwen/qwen3-coder-30b-a3b-instruct"
base_url = "https://openrouter.ai/api/v1"
api_key = "${OPENROUTER_API_KEY}"
max_tokens = 4096
temperature = 0.7
api_type = "openai"
max_model_len = 128000

########################################################################
# Stage 4: SQL Revision (unit testing tool-chain repair)
########################################################################
[sql_revision]
n_parallel = 4
n_internal_parallel = 8
save_path = "workspace_p2/sql_revision/bird/dev.snapshot"
checker_sampling_budget = 3

[sql_revision.llm]
model = "qwen/qwen3-coder-30b-a3b-instruct"
base_url = "https://openrouter.ai/api/v1"
api_key = "${OPENROUTER_API_KEY}"
max_tokens = 4096
temperature = 0.7
api_type = "openai"
max_model_len = 128000

########################################################################
# Stage 5: SQL Selection (tournament pairwise comparison)
########################################################################
[sql_selection]
n_parallel = 8
n_internal_parallel = 4
save_path = "workspace_p2/sql_selection/bird/dev.snapshot"
filter_top_k_sql = 3
evaluator_sampling_budget = 5
shortcut_consistency_score_threshold = 0.6

[sql_selection.llm]
model = "qwen/qwen3-coder-30b-a3b-instruct"
base_url = "https://openrouter.ai/api/v1"
api_key = "${OPENROUTER_API_KEY}"
max_tokens = 4096
temperature = 0.7
api_type = "openai"
max_model_len = 128000

[llm_extractor]
max_retry = 5
